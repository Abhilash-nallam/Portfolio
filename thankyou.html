<!DOCTYPE html>
<html lang="en">
<head>

            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .message-container {
            background-color: white;
            padding: 50px;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 90%;
            border-left: 5px solid #0078D7;
        }
        h1 {
            color: #0078D7;
            font-size: 32px;
            margin-bottom: 15px;
        }
        p {
            color: #555;
            font-size: 18px;
            margin-bottom: 30px;
        }
        .home-button {
            padding: 10px 20px;
            background-color: #0078D7;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        .home-button:hover {
            background-color: #005bb5;
        }

    <div class="message-container">
        <h1>✅ Submission Successful!</h1>
